version: '3.8'

services:
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 admin password;
      mc mb myminio/warehouse || true;
      "

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: lakekeeper_pass
      POSTGRES_DB: lakekeeper_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakekeeper -d lakekeeper_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  lakekeeper-init:
    image: quay.io/lakekeeper/catalog:latest
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://lakekeeper:lakekeeper_pass@postgres:5432/lakekeeper_db
      - LAKEKEEPER__PG_ENCRYPTION_KEY=ThisIsAVerySecretKey12345678901234

  lakekeeper:
    image: quay.io/lakekeeper/catalog:latest
    command: ["serve"]
    depends_on:
      lakekeeper-init:
        condition: service_completed_successfully
    environment:
      - LAKEKEEPER__PG_DATABASE_URL_READ=postgresql://lakekeeper:lakekeeper_pass@postgres:5432/lakekeeper_db
      - LAKEKEEPER__PG_DATABASE_URL_WRITE=postgresql://lakekeeper:lakekeeper_pass@postgres:5432/lakekeeper_db
      - LAKEKEEPER__PG_ENCRYPTION_KEY=ThisIsAVerySecretKey12345678901234
      - LAKEKEEPER__BASE_URI=http://lakekeeper:8181
      - RUST_LOG=info
      - LAKEKEEPER__S3_ENDPOINT=http://minio:9000
      - LAKEKEEPER__S3_ACCESS_KEY_ID=admin
      - LAKEKEEPER__S3_SECRET_ACCESS_KEY=password
      - LAKEKEEPER__S3_REGION=us-east-1
      - LAKEKEEPER__DEFAULT_WAREHOUSE_LOCATION=s3://warehouse/
    ports:
      - "8181:8181"

  gravitino:
    image: apache/gravitino:0.8.0-incubating
    ports:
      - "8090:8090" # Web UI
      - "9002:9001" # Iceberg REST Proxy
    volumes:
      - ./gravitino.conf:/opt/gravitino/conf/gravitino.conf
    depends_on:
      - lakekeeper

  spark-iceberg:
    image: tabulario/spark-iceberg:latest
    depends_on:
      - gravitino
      - minio
    environment:
      - AWS_ACCESS_KEY_ID=admin
      - AWS_SECRET_ACCESS_KEY=password
      - AWS_REGION=us-east-1
    volumes:
      - ./spark-defaults.conf:/opt/spark/conf/spark-defaults.conf